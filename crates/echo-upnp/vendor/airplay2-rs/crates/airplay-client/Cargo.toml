[package]
name = "airplay-client"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/lmcgartland/airplay2-rs"
description = "High-level AirPlay 2 sender client"

[dependencies]
airplay-core = { path = "../airplay-core" }
airplay-discovery = { path = "../airplay-discovery" }
airplay-crypto = { path = "../airplay-crypto" }
airplay-pairing = { path = "../airplay-pairing" }
airplay-rtsp = { path = "../airplay-rtsp" }
airplay-audio = { path = "../airplay-audio" }
airplay-timing = { path = "../airplay-timing" }
tokio = { version = "1.37", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
tracing = "0.1"
uuid = { version = "1.8", features = ["v4", "serde"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"
test-case = "3.3"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
