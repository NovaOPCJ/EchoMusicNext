[package]
name = "airplay-bluetooth"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/lmcgartland/airplay2-rs"
description = "Bluetooth A2DP audio source for AirPlay 2 streaming"

[target.'cfg(target_os = "linux")'.dependencies]
airplay-core = { path = "../airplay-core" }
airplay-audio = { path = "../airplay-audio" }
airplay-resampler = { path = "../airplay-resampler" }

# Bluetooth (Linux only via BlueZ D-Bus)
bluer = { version = "0.17", features = ["full"] }

# ALSA audio capture
alsa = "0.9"

# Async runtime
tokio = { version = "1.37", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# Channels for audio thread communication
crossbeam-channel = "0.5"

# System calls
libc = "0.2"

# Error handling
thiserror = "1.0"

# Logging
tracing = "0.1"

[dev-dependencies]
tokio-test = "0.4"
