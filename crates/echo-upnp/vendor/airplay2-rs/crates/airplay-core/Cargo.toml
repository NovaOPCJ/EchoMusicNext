[package]
name = "airplay-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/lmcgartland/airplay2-rs"

[dependencies]
thiserror = "1.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
proptest = "1.4"
test-case = "3.3"
