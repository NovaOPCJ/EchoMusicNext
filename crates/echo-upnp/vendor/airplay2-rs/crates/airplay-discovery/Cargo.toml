[package]
name = "airplay-discovery"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/lmcgartland/airplay2-rs"
description = "mDNS/Bonjour service discovery for AirPlay devices"

[dependencies]
airplay-core = { path = "../airplay-core" }
uuid = { version = "1.8", features = ["v4", "serde"] }
tokio = { version = "1.37", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"
async-stream = "0.3"
mdns-sd = "0.11"
tracing = "0.1"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"
test-case = "3.3"
