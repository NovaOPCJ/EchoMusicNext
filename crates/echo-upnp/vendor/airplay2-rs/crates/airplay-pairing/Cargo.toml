[package]
name = "airplay-pairing"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/lmcgartland/airplay2-rs"
description = "HomeKit and FairPlay authentication for AirPlay 2"

[dependencies]
airplay-core = { path = "../airplay-core" }
airplay-crypto = { path = "../airplay-crypto" }
tokio = { version = "1.37", features = ["full"] }
async-trait = "0.1"
tracing = "0.1"
sha2 = "0.10"
plist = "1.6"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"
test-case = "3.3"
rand = "0.8"
num-bigint = { version = "0.4", features = ["rand"] }
sha2 = "0.10"
airplay-discovery = { path = "../airplay-discovery" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.10"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
aes = "0.8"
ctr = "0.9"
chacha20poly1305 = "0.10"
