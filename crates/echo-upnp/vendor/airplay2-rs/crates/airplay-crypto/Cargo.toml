[package]
name = "airplay-crypto"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/lmcgartland/airplay2-rs"
description = "Cryptographic primitives for AirPlay 2 authentication and streaming"

[features]
default = []
srp-debug = []  # Enable SRP transcript logging for debugging M4 failures

[dependencies]
airplay-core = { path = "../airplay-core" }

# Cryptography
rand = "0.8"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
curve25519-dalek = { version = "4.1", features = ["digest"] }
chacha20poly1305 = "0.10"
aes = "0.8"
cbc = "0.1"
aes-gcm = "0.10"
ctr = "0.9"
sha2 = "0.10"
hkdf = "0.12"
num-bigint = { version = "0.4", features = ["rand"] }

# RSA encryption (for RAOP key exchange)
rsa = "0.9"
sha1 = "0.10"

# Digest authentication (RFC 2617)
md-5 = "0.10"

# Base64 encoding (for SDP key attributes)
base64 = "0.22"

# Utilities
zeroize = { version = "1.7", features = ["derive"] }
subtle = "2.5"

[dev-dependencies]
proptest = "1.4"
test-case = "3.3"
hex = "0.4"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "crypto_benches"
harness = false
