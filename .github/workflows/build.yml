name: Build EchoMusicNext Desktop
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      matrix: ${{ steps.release.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate release version and matrix
        id: release
        run: |
          echo "version=$(node tools/release/contract.mjs version)" >> "$GITHUB_OUTPUT"
          echo "matrix=$(node tools/release/contract.mjs matrix)" >> "$GITHUB_OUTPUT"
      - name: Release contract tests
        run: node --test tools/release/contract.test.mjs tools/release/publish.test.mjs tools/release/symbols.test.mjs
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Pinned formatting tools
        run: python scripts/format.py --install
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.arch }}
      - name: Build tools
        run: python -m pip install cmake==4.4.4 ninja==1.13.0
      - name: Linux Qt prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ruby-dev rpm zstd libarchive-tools libfuse2 build-essential libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev libwayland-dev wayland-protocols libxkbcommon-dev libxkbcommon-x11-dev libxcb-cursor-dev libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev libxcb-render-util0-dev libxcb-xinerama0-dev libxcb-xkb-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-shm0-dev libxcb-sync-dev libxcb-util-dev libxcb-xfixes0-dev libxcb-glx0-dev libx11-dev libx11-xcb-dev libxext-dev libxrender-dev libxi-dev libxfixes-dev libfontconfig1-dev libfreetype-dev libgtk-3-dev libatspi2.0-dev libdbus-1-dev libglib2.0-dev libproxy-dev libcurl4-openssl-dev libproxy1-plugin-gsettings libproxy1-plugin-networkmanager libproxy1-plugin-kconfig libproxy1-plugin-webkit libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev libpulse-dev libva-dev libssl-dev libnss3-dev libdrm-dev libxcomposite-dev libxcursor-dev libxrandr-dev libxtst-dev libxshmfence-dev libxkbfile-dev
      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo gem install fpm -v 1.17.0 --no-document
      - name: Windows packaging tools
        if: runner.os == 'Windows'
        run: choco install nsis --version=3.11 -y --no-progress
      - name: Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Rust checks
        run: |
          node tools/release/rust-check.mjs format
          node tools/release/rust-check.mjs lint
          node tools/release/rust-check.mjs test
          cargo run --locked -p ffi-header -- --check
      - name: Cache pinned Qt SDK
        uses: actions/cache@v4
        with:
          path: |
            build/qt-official
            build/qt-sdk
          key: qt-6.12.0-${{ matrix.runner }}-${{ matrix.arch }}-${{ hashFiles('scripts/qt_sdk.py', 'scripts/qt_download.py', 'scripts/install-qt.py', 'scripts/build-qt.py', 'tools/qt/requirements.txt', 'tools/release/licenses.mjs') }}
      - name: Prepare and validate SDK
        run: python scripts/install-qt.py
      - name: SDK runtime path
        shell: bash
        run: |
          python -c "from scripts.qt_sdk import preferred_prefix; import os; p=preferred_prefix(); open(os.environ['GITHUB_PATH'], 'a').write(str(p / 'bin') + '\n'); open(os.environ['GITHUB_ENV'], 'a').write('QT_PREFIX=' + p.as_posix() + '\n')"
      - name: Formatting check
        run: python scripts/format.py --check
      - name: Tooling tests
        run: python -m unittest discover -s tests/tooling -v
      - name: Configure
        shell: bash
        run: |
          python scripts/build.py --preset release --configure-only --distribution
          cmake -S . -B build/release "-DECHO_RELEASE_VERSION=$RELEASE_VERSION"
      - name: Build
        run: cmake --build --preset release
      - name: Qt tests
        run: ctest --preset release
      - name: QML lint
        run: cmake --build build/release --target all_qmllint
      - name: Prepare deployment materials
        run: node tools/release/prepare.mjs
      - name: Package
        shell: bash
        run: node tools/release/package.mjs --arch=${{ matrix.arch }} "--qt=$QT_PREFIX" --linuxdeploy=build/release-tools/linuxdeploy-${{ matrix.arch == 'arm64' && 'aarch64' || 'x86_64' }}.AppImage
      - name: Preserve matching native symbols
        run: node tools/release/symbols.mjs ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: symbols-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.run_id }}
          path: build/symbols/*
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: build/packages/*
          if-no-files-found: error
          retention-days: 7
  release:
    needs: [prepare, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: build/release-assets
      - name: Validate complete release
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: node tools/release/contract.mjs validate build/release-assets "$RELEASE_VERSION"
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/release/publish.mjs
