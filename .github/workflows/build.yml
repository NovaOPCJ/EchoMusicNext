name: Native desktop build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, arch: x64 }
          - { os: ubuntu-22.04-arm, arch: arm64 }
          - { os: macos-15-intel, arch: x64 }
          - { os: macos-15, arch: arm64 }
          - { os: windows-2022, arch: x64 }
          - { os: windows-11-arm, arch: arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Pinned formatting tools
        run: python scripts/format.py --install
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.arch }}
      - name: Build tools
        run: python -m pip install cmake==4.4.4 ninja==1.13.0
      - name: Linux Qt prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev libwayland-dev wayland-protocols libxkbcommon-dev libxkbcommon-x11-dev libxcb-cursor-dev libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev libxcb-render-util0-dev libxcb-xinerama0-dev libxcb-xkb-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-shm0-dev libxcb-sync-dev libxcb-util-dev libxcb-xfixes0-dev libxcb-glx0-dev libx11-dev libx11-xcb-dev libxext-dev libxrender-dev libxi-dev libxfixes-dev libfontconfig1-dev libfreetype-dev libgtk-3-dev libatspi2.0-dev libdbus-1-dev libglib2.0-dev libproxy-dev libcurl4-openssl-dev libproxy1-plugin-gsettings libproxy1-plugin-networkmanager libproxy1-plugin-kconfig libproxy1-plugin-webkit libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev libpulse-dev libva-dev libssl-dev libnss3-dev libdrm-dev libxcomposite-dev libxcursor-dev libxrandr-dev libxtst-dev libxshmfence-dev libxkbfile-dev
      - name: Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Rust checks
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
          cargo run --locked -p ffi-header -- --check
      - name: Cache pinned Qt SDK
        uses: actions/cache@v4
        with:
          path: |
            build/qt-official
            build/qt-sdk
          key: qt-6.12.0-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('scripts/qt_sdk.py', 'scripts/qt_download.py', 'scripts/install-qt.py', 'scripts/build-qt.py', 'tools/qt/requirements.txt') }}
      - name: Prepare and validate SDK
        run: python scripts/install-qt.py
      - name: SDK runtime path
        shell: bash
        run: python -c "from scripts.qt_sdk import preferred_prefix; import os; open(os.environ['GITHUB_PATH'], 'a').write(str(preferred_prefix() / 'bin') + '\n')"
      - name: Formatting check
        run: python scripts/format.py --check
      - name: Tooling tests
        run: python -m unittest discover -s tests/tooling -v
      - name: Configure
        run: python scripts/build.py --preset release --configure-only
      - name: Build
        run: cmake --build --preset release
      - name: Qt tests
        run: ctest --preset release
      - name: QML lint
        run: cmake --build build/release --target all_qmllint
